<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PPL Theory</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f2f7; --bg2:#ffffff; --card:#ffffff; --card2:#f2f2f7;
  --sep:rgba(60,60,67,.20); --sep2:rgba(60,60,67,.12);
  --tx:#000; --tx2:rgba(60,60,67,.62); --tx3:rgba(60,60,67,.34);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30;
  --purple:#af52de; --teal:#30b0c7; --indigo:#5856d6; --pink:#ff2d55; --brown:#a2845e;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --bar:rgba(249,249,249,.82);
  --sh:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-t="light"]){
  --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --card2:#2c2c2e;
  --sep:rgba(84,84,88,.65); --sep2:rgba(84,84,88,.40);
  --tx:#fff; --tx2:rgba(235,235,245,.60); --tx3:rgba(235,235,245,.30);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6; --pink:#ff375f; --brown:#ac8e68;
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --bar:rgba(28,28,30,.82);
  --sh:none;
}}
:root[data-t="dark"]{
  --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --card2:#2c2c2e;
  --sep:rgba(84,84,88,.65); --sep2:rgba(84,84,88,.40);
  --tx:#fff; --tx2:rgba(235,235,245,.60); --tx3:rgba(235,235,245,.30);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6; --pink:#ff375f; --brown:#ac8e68;
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --bar:rgba(28,28,30,.82); --sh:none;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  letter-spacing:-.01em;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.026em}
/* numerals line up in columns, the way timetables and flight strips do */
.tile .n,.val,.wxst .v,.score .big,.bdg,.chip,td.mono,.mono{font-variant-numeric:tabular-nums}
p{margin:0 0 12px}p:last-child{margin-bottom:0}
a{color:var(--blue);text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
[hidden]{display:none!important}

/* ---------- layout ---------- */
#app{max-width:720px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom))}
.hd{padding:8px 0 4px}
.hd h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
.hd .sub{color:var(--tx2);font-size:15px;margin-top:2px}
h2.sec{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:var(--tx2);margin:26px 0 8px;padding:0 4px}
h2.sec:first-child{margin-top:14px}

/* nav bar for pushed views */
.nav{position:sticky;top:0;z-index:30;background:var(--bar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);margin:0 -16px 0;padding:env(safe-area-inset-top) 8px 0;
  display:flex;align-items:center;gap:4px;min-height:44px}
.nav .back{color:var(--blue);font-size:17px;padding:10px 8px;display:flex;align-items:center;gap:2px}
.nav .ttl{flex:1;text-align:center;font-size:17px;font-weight:600;padding:10px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .rt{min-width:60px;text-align:right;color:var(--blue);font-size:17px;padding:10px 8px}

/* ---------- tab bar ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--bar);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;
  gap:2px;color:var(--tx3);font-size:10px;font-weight:500;letter-spacing:0}
#tabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected="true"]{color:var(--blue)}

/* ---------- grouped list ---------- */
.grp{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.grp + .grp{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;
  text-align:left;min-height:48px}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;
  background:var(--sep2)}
.row:active{background:var(--fill)}
.row .ic,.ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:#fff;font-size:12px;font-weight:700;letter-spacing:0;
  background:linear-gradient(145deg,
    color-mix(in srgb, var(--c,var(--blue)) 100%, #fff 16%),
    color-mix(in srgb, var(--c,var(--blue)) 82%, #000 18%));
  box-shadow:0 1px 3px color-mix(in srgb, var(--c,var(--blue)) 40%, transparent)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:400;font-size:17px}
.row .tx i{display:block;font-style:normal;font-size:13px;color:var(--tx2);margin-top:1px}
.row .val{color:var(--tx2);font-size:15px;flex:none}
.row .chev{color:var(--tx3);flex:none;font-size:17px;margin-left:-4px}
.row.plain{display:block;padding:14px 16px}

/* ---------- cards & tiles ---------- */
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.card + .card{margin-top:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:2px;text-align:left;position:relative}
.tile .k{padding-right:26px}
.info{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;
  background:var(--fill);color:var(--tx2);font:700 12px/1 Georgia,"Times New Roman",serif;
  font-style:italic;display:grid;place-items:center;flex:none}
.info:active{background:var(--fill2);color:var(--blue)}
.tile .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  color:var(--tx2)}
.tile .n{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:4px;
  display:flex;align-items:baseline;gap:1px}
.tile .n .of{font-size:.62em;font-weight:700;color:var(--tx3);letter-spacing:-.02em}
.tile .s{font-size:13px;color:var(--tx2)}

/* buttons */
.btn{display:block;width:100%;background:var(--blue);color:#fff;border-radius:12px;
  padding:14px;font-size:17px;font-weight:600;text-align:center}
.btn:active{opacity:.8}
.btn.sec{background:var(--fill);color:var(--blue)}
.btn.grey{background:var(--fill);color:var(--tx)}
.btn.grn{background:var(--green)}
.btn.warn{background:var(--orange)}
.btn.dgr{background:var(--red)}
.btn:disabled{opacity:.4}
.btn.sm{padding:10px;font-size:15px;border-radius:10px}
.brow{display:flex;gap:10px}
.brow .btn{flex:1}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 14px}
.seg button{flex:1;padding:7px 4px;font-size:13px;font-weight:600;border-radius:7px;
  color:var(--tx);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* progress */
.pbar{height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--blue);
  transition:width .3s cubic-bezier(.4,0,.2,1)}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}

/* badges */
.bdg{display:inline-block;padding:3px 8px;border-radius:99px;font-size:12px;font-weight:600;
  background:var(--fill);color:var(--tx2);letter-spacing:0}
.bdg.g{background:rgba(52,199,89,.16);color:var(--green)}
.bdg.o{background:rgba(255,149,0,.16);color:var(--orange)}
.bdg.r{background:rgba(255,59,48,.16);color:var(--red)}
.bdg.b{background:rgba(0,122,255,.14);color:var(--blue)}

/* notes */
.note{border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.45;
  background:var(--card);box-shadow:var(--sh)}
.note b:first-child{display:block;margin-bottom:3px;font-weight:600}
.note.b{background:rgba(0,122,255,.10)}
.note.o{background:rgba(255,149,0,.13)}
.note.r{background:rgba(255,59,48,.12)}
.note.g{background:rgba(52,199,89,.13)}
.note + .note{margin-top:10px}

.chip{display:inline-block;min-width:30px;text-align:center;padding:2px 5px;border-radius:5px;
  color:#fff;font:700 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:0}
.mv{width:34px;height:34px;border-radius:9px;background:var(--fill);color:var(--tx2);
  font-size:11px;flex:none;display:grid;place-items:center}
.mv:disabled{opacity:.25}
.mv:active{background:var(--fill2)}

/* text inputs */
.ti{width:100%;background:var(--fill);color:var(--tx);border:1.5px solid transparent;
  border-radius:10px;padding:12px;font:inherit;font-size:17px;transition:.15s}
.ti:focus{outline:none;border-color:var(--blue);background:var(--bg2)}

/* weather card — flight-strip cues: big code, tabular figures, status pill */
.wxcard{display:block;width:100%;text-align:left;margin:16px 0 18px;padding:14px 15px 12px;
  border-radius:16px;background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden}
.wxcard::before{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;
  background:radial-gradient(90% 140% at 100% 0%, var(--c,var(--blue)) 0%, transparent 60%)}
.wxcard > *{position:relative}
.wxcard:active{background:var(--fill)}
.wxtop{display:flex;align-items:baseline;gap:9px}
.wxid{font:800 21px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;flex:none}
.wxplace{flex:1;min-width:0;font-size:13px;color:var(--tx2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.wxcat{font:800 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.06em;color:#fff;
  padding:6px 9px;border-radius:7px;flex:none;background:var(--c);
  box-shadow:0 1px 4px color-mix(in srgb, var(--c) 45%, transparent)}
.wxraw{font:600 13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.01em;
  margin-top:11px;word-break:break-word;font-variant-numeric:tabular-nums}
.wxstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;
  padding-top:11px;border-top:.5px solid var(--sep2)}
.wxst .k{font:600 9.5px/1 -apple-system,system-ui,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tx3)}
.wxst .v{font:700 14px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxfoot{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:11.5px;color:var(--tx3)}
.wxfoot > span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxsrc{font:800 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--tx2);
  border:1px solid var(--sep);border-radius:4px;padding:4px 5px;flex:none}
.wxgo{color:var(--tx3);font-size:17px;flex:none}
.wxload{margin-top:10px;font-size:13.5px;color:var(--tx2)}
.wxbig{font:800 46px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.03em;color:var(--c)}

/* airfield autocomplete */
.ac{position:relative}
.aclist{margin-top:8px;border-radius:10px;overflow:hidden;background:var(--bg2);
  box-shadow:0 2px 10px rgba(0,0,0,.10);border:.5px solid var(--sep2)}
.aclist button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:11px 13px;position:relative}
.aclist button + button::before{content:"";position:absolute;left:13px;right:0;top:0;height:.5px;
  background:var(--sep2)}
.aclist button:active{background:var(--fill)}
.aclist .cd{font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--blue);flex:none;width:38px}
.aclist .nm{font-size:15px;line-height:1.3}
.aclist .nm i{display:block;font-style:normal;font-size:12.5px;color:var(--tx2);margin-top:1px}
.acfound{margin-top:9px;font-size:14px;color:var(--green);font-weight:600}
.acfound i{display:block;font-style:normal;font-weight:400;color:var(--tx2);font-size:13px;margin-top:1px}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));
  z-index:60;background:var(--tx);color:var(--bg);border-radius:12px;padding:13px 16px;
  font-size:15px;font-weight:500;text-align:center;opacity:0;transform:translateY(12px);
  transition:.28s cubic-bezier(.2,.8,.2,1);max-width:688px;margin:0 auto;pointer-events:none}
.toast.in{opacity:1;transform:none}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;
  background:var(--card);box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;inset:0;opacity:.10;pointer-events:none;
  background:radial-gradient(120% 130% at 100% 0%, var(--blue) 0%, transparent 55%),
             radial-gradient(90% 120% at 0% 100%, var(--indigo) 0%, transparent 55%)}
.hero > *{position:relative}

/* subject banner */
.banner{position:relative;overflow:hidden;border-radius:18px;padding:20px 18px;margin-top:14px;
  color:#fff;background:linear-gradient(140deg,
    color-mix(in srgb, var(--c) 100%, #fff 14%),
    color-mix(in srgb, var(--c) 76%, #000 24%))}
.banner h1{font-size:27px;line-height:1.12}
.banner .m{font-size:13.5px;opacity:.9;margin-top:6px}
.banner .code{position:absolute;right:-6px;top:-16px;font:800 92px/1 ui-monospace,Menlo,monospace;
  opacity:.16;letter-spacing:-.05em}
.banner .pb{height:6px;background:rgba(255,255,255,.28);border-radius:99px;margin-top:14px;overflow:hidden}
.banner .pb i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* section headers get a small coloured marker */
h2.sec{display:flex;align-items:center;gap:7px}
h2.sec::before{content:"";width:4px;height:12px;border-radius:2px;background:var(--blue);opacity:.85}

/* entrance */
/* no fill-mode: if the animation never runs, elements stay at their natural, visible state */
#app > *{animation:fade .26s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app > *{animation:none}}

/* ---------- diagrams ---------- */
figure{margin:22px 0;padding:0}
figure .dgwrap{background:var(--card);border-radius:14px;padding:14px 12px 10px;
  box-shadow:var(--sh);overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;position:relative}
figure .swipe{font-size:11.5px;color:var(--tx3);margin:6px 0 0 4px;display:none}
@media (max-width:560px){figure .swipe{display:block}}
figcaption{font-size:13.5px;line-height:1.45;color:var(--tx2);margin-top:10px;padding:0 4px}
figcaption b{color:var(--tx);font-weight:600}
/* Diagrams keep a readable minimum size and scroll sideways on a narrow phone,
   rather than shrinking their labels into illegibility. */
.dg{width:100%;height:auto;display:block;color:var(--tx);min-width:520px}
.dg text{font:600 13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  fill:currentColor;letter-spacing:-.005em}
.dg text.s{font-size:11.5px;font-weight:500;opacity:.66}
.dg text.b{font-size:14px;font-weight:700}
.dg text.sb{font-size:11.5px;font-weight:500;opacity:.66}
.dg .ink{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .thin{fill:none;stroke:currentColor;stroke-width:1;opacity:.32}
.dg .dash{stroke-dasharray:5 4}
.dg .fill{fill:currentColor;stroke:none}
.dg .tint{fill:currentColor;opacity:.06;stroke:none}
.dg .blue{stroke:var(--blue)}   .dg .fblue{fill:var(--blue);stroke:none}
.dg .red{stroke:var(--red)}     .dg .fred{fill:var(--red);stroke:none}
.dg .green{stroke:var(--green)} .dg .fgreen{fill:var(--green);stroke:none}
.dg .orange{stroke:var(--orange)}
.dg text.blue-t{fill:var(--blue)}  .dg text.red-t{fill:var(--red)}
.dg text.green-t{fill:var(--green)} .dg text.orange-t{fill:var(--orange)}

/* ---------- article ---------- */
.article{font-size:17px;line-height:1.58;padding:4px 0 20px}
.article h3{font-size:20px;font-weight:700;margin:26px 0 8px;letter-spacing:-.02em}
.article p{margin:0 0 14px}
.article ul,.article ol{margin:0 0 14px;padding-left:22px}
.article li{margin-bottom:7px}
.article b{font-weight:600}
.article table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:15px;
  background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.article th{text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;color:var(--tx2);padding:9px 12px;background:var(--card2)}
.article td{padding:9px 12px;border-top:.5px solid var(--sep2);vertical-align:top}
.article .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px;
  background:var(--card);padding:11px 13px;border-radius:10px;display:block;
  overflow-x:auto;box-shadow:var(--sh)}
.article .trap{background:rgba(255,149,0,.13);border-radius:12px;padding:14px 16px;
  margin:22px 0 0;font-size:15.5px}
.article .trap b:first-child{display:block;font-weight:700;margin-bottom:6px;color:var(--orange)}
.article .trap ul{margin-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- LO checklist ---------- */
.gtitle{font-size:13px;font-weight:600;color:var(--tx2);margin:20px 0 6px;padding:0 4px;
  display:flex;gap:8px}
.gtitle span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--tx3);flex:none}
.lo{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;width:100%;text-align:left;
  position:relative;font-size:16px;line-height:1.4}
.lo + .lo::before{content:"";position:absolute;left:48px;right:0;top:0;height:.5px;
  background:var(--sep2)}
.lo .bx{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--tx3);flex:none;
  margin-top:1px;display:grid;place-items:center;transition:.15s}
.lo.on .bx{background:var(--blue);border-color:var(--blue)}
.lo .bx svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round}
.lo.on .bx svg{opacity:1}
.lo.on .t{color:var(--tx2)}
.lo .t{flex:1;min-width:0}
.lo .t em{display:block;font-style:normal;font-family:ui-monospace,Menlo,monospace;
  font-size:11px;color:var(--tx3);margin-top:3px;letter-spacing:0}
.lo .ctx{display:inline-block;font-size:10px;font-weight:700;color:var(--orange);
  border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-left:5px;
  vertical-align:2px;letter-spacing:.02em}

/* ---------- quiz ---------- */
.qwrap{padding-top:8px}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13px;color:var(--tx2);margin-bottom:8px;font-weight:600}
.qmeta span:first-child{flex:none}
.qmeta span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:right}
.qtext{font-size:21px;font-weight:600;line-height:1.32;margin:16px 0 20px;
  letter-spacing:-.02em}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border-radius:12px;padding:14px 15px;font-size:16.5px;
  line-height:1.4;box-shadow:var(--sh);border:1.5px solid transparent;transition:.12s}
.opt + .opt{margin-top:9px}
.opt:active{transform:scale(.985)}
.opt .lt{width:24px;height:24px;border-radius:50%;background:var(--fill);flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--tx2)}
.opt.sel{border-color:var(--blue)}
.opt.sel .lt{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:rgba(52,199,89,.10)}
.opt.ok .lt{background:var(--green);color:#fff}
.opt.no{border-color:var(--red);background:rgba(255,59,48,.09)}
.opt.no .lt{background:var(--red);color:#fff}
.why{background:var(--card);border-radius:12px;padding:14px 15px;margin-top:12px;
  font-size:15px;line-height:1.5;box-shadow:var(--sh)}
.why b{font-weight:600}
.why .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--tx3);
  font-family:ui-monospace,Menlo,monospace}
.qfoot{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));padding-top:14px;
  background:linear-gradient(to bottom,transparent,var(--bg) 28%)}

/* score ring */
.score{display:flex;flex-direction:column;align-items:center;padding:22px 0 6px}
.score .big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1}
.score .lbl{font-size:17px;font-weight:600;margin-top:6px}
.score .sub{color:var(--tx2);font-size:15px;margin-top:2px}

/* ---------- flashcards ---------- */
.fc{background:var(--card);border-radius:18px;padding:28px 22px;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;
  box-shadow:0 2px 16px rgba(0,0,0,.07);margin-top:8px}
:root[data-t="dark"] .fc,
:root:not([data-t="light"]) .fc{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-t="light"]) .fc{box-shadow:none}}
.fc .q{font-size:22px;font-weight:600;line-height:1.32;letter-spacing:-.02em}
.fc .hr{height:.5px;background:var(--sep);margin:20px -22px}
.fc .a{font-size:18px;line-height:1.5;color:var(--tx)}
.fc .rf{margin-top:14px;font-size:12px;color:var(--tx3);font-family:ui-monospace,Menlo,monospace}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades button{padding:12px 2px;border-radius:11px;font-size:14px;font-weight:600;
  background:var(--fill);display:flex;flex-direction:column;gap:2px;align-items:center}
.grades button small{font-size:10.5px;font-weight:500;color:var(--tx2)}
.grades .g1{color:var(--red)} .grades .g2{color:var(--orange)}
.grades .g3{color:var(--blue)} .grades .g4{color:var(--green)}

.empty{text-align:center;padding:50px 20px;color:var(--tx2)}
.empty .em{font-size:44px;margin-bottom:10px}
.empty h3{font-size:19px;margin-bottom:6px;color:var(--tx)}
.foot{text-align:center;padding:28px 8px 10px;font-size:12.5px;color:var(--tx3);line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
input[type=date],select,input[type=number]{width:100%;background:var(--fill);color:var(--tx);
  border:0;border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
label.f{display:block;font-size:12px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;color:var(--tx2);margin:0 0 5px 4px}
.flabel{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.clr{font-size:13px;font-weight:600;color:var(--blue);padding:0 4px 5px}
.clr:active{opacity:.6}
.fld + .fld{margin-top:14px}
.fld .tiny{font-size:11.5px;line-height:1.4;color:var(--tx3);margin-left:2px}
</style>
